<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dipshikha Jewellers 2027</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink: #111; }
  html, body { margin: 0; background: #ffffff; }
  body { padding: 20px; display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  /* plain mode = black ink only (transparent bg) for laser / print */
  body.plain .wood { display: none; }
  svg.card { display: block; width: 500px; height: 700px; }
  .title { font-family: 'Noto Serif Bengali', serif; font-weight: 700; }
  .bn { font-family: 'Noto Sans Bengali', sans-serif; font-weight: 600; }
  .mon { font-family: 'Archivo Black', sans-serif; }
  .wk { font-family: 'Archivo Black', sans-serif; }
  .d { font-family: 'Arimo', Arial, sans-serif; font-weight: 700; }
  .yr { font-family: 'Archivo Black', sans-serif; }
  .logo { font-family: 'Tinos', 'Times New Roman', serif; }
</style>
</head>
<body>
<script>
// ---------- editable content ----------
const YEAR = 2027;
const SHOP = 'দ্বীপশিখা জুয়েলার্স';
const OWNER = 'প্রোঃ স্বপন সোম';
const ADDR1 = '১৮ নং হেলাতলা রোড,';
const ADDR2 = 'খুলনা, হাটখোলার নিচে, খুলনা';
const PHONE1 = '০১৭১৬১৩১৫৮৭';
const PHONE2 = '০১৯০৫৬৬৯৭৪৮';
// Official bKash logo: put the file in this folder and set its name here, e.g. 'bkash-logo.png'.
// Left empty, a drawn bKash mark is used instead.
const BKASH_LOGO = '';
// ---------------------------------------

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const NS = 'http://www.w3.org/2000/svg';
const W = 500, H = 700;

function monthGrid(y, m) {
  const first = new Date(y, m, 1).getDay();          // 0 = Sunday
  const days = new Date(y, m + 1, 0).getDate();
  const rows = []; let row = new Array(7).fill(null);
  let col = first;
  for (let d = 1; d <= days; d++) {
    row[col] = d; col++;
    if (col === 7) { rows.push(row); row = new Array(7).fill(null); col = 0; }
  }
  if (row.some(v => v)) rows.push(row);
  return rows;
}

function monthBlock(m, x0, y0) {
  const cw = 170 / 7;
  let s = `<text class="mon" x="${x0 + 85}" y="${y0 + 19}" font-size="19" text-anchor="middle">${MONTHS[m]}</text>`;
  'SMTWTFS'.split('').forEach((c, i) => {
    s += `<text class="wk" x="${x0 + cw * (i + .5)}" y="${y0 + 35}" font-size="8.5" text-anchor="middle">${c}</text>`;
  });
  s += `<line x1="${x0}" y1="${y0 + 39.5}" x2="${x0 + 170}" y2="${y0 + 39.5}" stroke="#111" stroke-width="1.6"/>`;
  monthGrid(YEAR, m).forEach((r, ri) => r.forEach((d, ci) => {
    if (d) s += `<text class="d" x="${x0 + cw * (ci + .5)}" y="${y0 + 56 + ri * 19}" font-size="13" text-anchor="middle">${d}</text>`;
  }));
  return s;
}

const pin = (cx, cy) => `
  <circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#111" stroke-width="2.6"/>
  <path d="M${cx} ${cy + 6.2} C ${cx - 2.6} ${cy + 2.4}, ${cx - 4.6} ${cy}, ${cx - 4.6} ${cy - 2.4}
           A 4.6 4.6 0 1 1 ${cx + 4.6} ${cy - 2.4} C ${cx + 4.6} ${cy}, ${cx + 2.6} ${cy + 2.4}, ${cx} ${cy + 6.2} Z" fill="#111"/>
  <circle cx="${cx}" cy="${cy - 2.6}" r="1.7" fill="#d9a066" class="hole"/>`;
const bkash = (cx, top) => {
  if (BKASH_LOGO) return `<image href="${BKASH_LOGO}" x="${cx - 19}" y="${top}" width="38" height="44" preserveAspectRatio="xMidYMid meet"/>`;
  // drawn origami-bird mark + "bKash" wordmark (monochrome, matches the engraving)
  const x = cx - 14.5, y = top, k = 0.85;
  const P = pts => `<polygon points="${pts.map(([a, b]) => `${x + a * k},${y + b * k}`).join(' ')}" fill="#111"/>`;
  return `
  ${P([[0, 9], [11, 5], [10, 13]])}
  ${P([[12, 6], [33, 0], [26, 15]])}
  ${P([[11, 15], [25.5, 16.5], [14, 27]])}
  ${P([[27, 17], [34, 22], [17, 27]])}
  <text x="${cx}" y="${y + 37}" font-family="'Archivo Black', sans-serif" font-size="10" text-anchor="middle" letter-spacing=".2">bKash</text>`;
};
const phone = (cx, cy) => `
  <circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#111" stroke-width="2.6"/>
  <path transform="translate(${cx - 6} ${cy - 6}) scale(0.5)" fill="#111"
    d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>`;

function card(half, idx) {
  const L = 25, R = 305, top = 94, pitch = 155;
  let body = '';
  for (let k = 0; k < 3; k++) {
    body += monthBlock(half * 6 + k * 2,     L, top + k * pitch);
    body += monthBlock(half * 6 + k * 2 + 1, R, top + k * pitch);
  }
  const digits = String(YEAR).split('');
  digits.forEach((dg, i) => {
    body += `<text class="yr" x="0" y="0" font-size="104" text-anchor="middle" transform="translate(250 ${197 + i * 117}) scale(1.16 1)">${dg}</text>`;
  });
  return `
<svg class="card" id="card${idx}" xmlns="${NS}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <defs>
    <clipPath id="clip${idx}"><rect width="${W}" height="${H}" rx="26"/></clipPath>
    <filter id="grain${idx}" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.0035" numOctaves="4" seed="${7 + idx}" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.50
                0 0 0 0 0.30
                0 0 0 0 0.12
                0 0 0 -2.2 1.35" />
    </filter>
    <linearGradient id="tone${idx}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b47c"/>
      <stop offset=".5" stop-color="#e2a96f"/>
      <stop offset="1" stop-color="#d99d62"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip${idx})" class="wood">
    <rect width="${W}" height="${H}" fill="url(#tone${idx})"/>
    <rect width="${W}" height="${H}" filter="url(#grain${idx})" opacity=".55"/>
  </g>
  <g fill="#111">
    <text class="title" x="250" y="66" font-size="46" text-anchor="middle">${SHOP}</text>
    <line x1="22" y1="88" x2="478" y2="88" stroke="#111" stroke-width="2.6"/>
    ${body}
    <!-- footer -->
    <text class="bn" x="115" y="591" font-size="17" text-anchor="middle">${OWNER}</text>
    ${pin(38, 614)}
    <text class="bn" x="54" y="609" font-size="10.6">${ADDR1}</text>
    <text class="bn" x="54" y="624" font-size="10.6">${ADDR2}</text>
    <g class="logo">
      <text x="208" y="621" font-size="66">D</text>
      <text x="236" y="643" font-size="48">S</text>
      <text x="262" y="633" font-size="40">j</text>
    </g>
    ${bkash(309, 590)} ${phone(342, 608)}
    <text class="d" x="356" y="602" font-size="14.5" letter-spacing=".3"><tspan class="bn" font-weight="700">${PHONE1}</tspan></text>
    <text class="d" x="356" y="620" font-size="14.5" letter-spacing=".3"><tspan class="bn" font-weight="700">${PHONE2}</tspan></text>
    <rect x="50" y="650" width="400" height="15" fill="#fff"/>
  </g>
</svg>`;
}

const params = new URLSearchParams(location.search);
if (params.has('plain')) document.body.classList.add('plain');
document.body.insertAdjacentHTML('beforeend', card(0, 1) + card(1, 2));
if (params.has('plain')) document.querySelectorAll('.hole').forEach(h => h.setAttribute('fill', '#fff'));
</script>
</body>
</html>
